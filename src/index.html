<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="grafico.css">

    <title>Finanzas Personales</title>
</head>

<body>

    <section class="opciones">
        <button onclick="window.location.href='./index.html'"><span
                class="material-symbols-outlined">donut_small</span></button>
        <button onclick="window.location.href='./categorias/categorias.html'"><span
                class="material-symbols-outlined">bar_chart</span></button>

    </section>

    <Section class="titulo">
        <h1>Finanzas Personales</h1>
    </Section>

    <section class="datosTotales">
        <div class="DIngresos">
            <h3 class="nombreElemento">Ingresos Totales</h3>
            <p class="cantTotal">$$$</p>
        </div>
        <div class="DGastos">
            <h3 class="nombreElemento">Gastos Totales</h3>
            <p class="cantTotal">$$$</p>
        </div>
    </section>

    <section class="listaGastos">
        <div class="opcB"><button class="BGasto">Gasto</button><button class="BIngreso">Ingreso</button></div>
        <ul class="listaTotal">
        </ul>
    </section>


    <section class="categorias">
        <canvas class="grafica"></canvas>
    </section>


    <dialog class="menuIngreso">
        <div>
            <input class="nombre" type="text" placeholder="Nuevo Ingreso...">
            <input class="cantidad" type="text" placeholder="Cantidad...">
        </div>
        <select class="catCompras">
            <option value="Ropa">Ropa</option>
            <option value="Comida">Comida</option>
            <option value="Entretenimiento">Entretenimiento</option>
            <option value="Medicina">Medicina</option>
            <option value="Varios">Varios</option>

        </select>
        <input type="date" class="fecha">
        <div>
            <button class="cerrar">Cerrar</button>
            <button class="guardar">Guardar</button>
        </div>
        <p class="hide">Error. Vuelva a itentarlo</p>
    </dialog>
    <dialog class="menuGasto">
        <div>
            <input class="nombre" type="text" placeholder="Nuevo Gasto...">
            <input class="cantidad" type="text" placeholder="Cantidad...">
        </div>
        <select class="catCompras">
            <option value="Ropa">Ropa</option>
            <option value="Comida">Comida</option>
            <option value="Entretenimiento">Entretenimiento</option>
            <option value="Medicina">medicina</option>
            <option value="Varios">Varios</option>

        </select>
        <input type="date" class="fecha">
        <div>
            <button class="cerrar">Cerrar</button>
            <button class="guardar">Guardar</button>
        </div>

        <p class="hide">Error. Vuelva a itentarlo</p>
    </dialog>

    <script type="module" src="function.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
