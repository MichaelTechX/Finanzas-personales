<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="grafico.css">

    <title>Finanzas Personales</title>
</head>
<body>

    <section class="opciones">
        <button onclick="window.location.href='./index.html'">Dona</button>
        <button onclick="window.location.href='./categorias/categorias.html'">Categorias</button>
        <button onclick="window.location.href='./tiempo/tiempo.html'">Tiempo</button>
        <button>Opciones</button>
    </section>

    <Section class="titulo">
        <h1>Finanzas Personales</h1>
    </Section>
    
    <section class="datosTotales">
        <div class="DIngresos"><h3 class="nombreElemento">Ingresos Totales</h3><p class="cantTotal">$$$</p></div>
        <div class="DGastos"><h3 class="nombreElemento">Gastos Totales</h3><p class="cantTotal">$$$</p></div>
    </section>

    <section class="listaGastos">
        <div class="opcB"><button class="BGasto">Gasto</button><button class="BIngreso">Ingreso</button></div>
        <ul class="listaTotal">
            <li class="EIngreso" data-categoria="trabajo"><span class="nombreElemento">Cobro</span><span class="cateElemento">Ingreso</span><span class="cantElemento">12000</span></li>
            <li class="EGasto" data-categoria="comida"><span class="nombreElemento">McDonald</span><span class="cateElemento">Comida</span><span class="cantElemento">12000</span></li>
            <li class="EGasto" data-categoria="ropa"><span class="nombreElemento">Campera de cuero</span><span class="cateElemento">Ropa</span><span class="cantElemento">12000</span></li>
            <li class="EIngreso" data-categoria="trabajo"><span class="nombreElemento">Cobro</span><span class="cateElemento">Cobro</span><span class="cantElemento">12000</span></li>
            <li class="EGasto" data-categoria="entretenimiento"><span class="nombreElemento">Juego</span><span  class="cateElemento">Entretenimiento</span><span class="cantElemento">12000</span></li>
        </ul> 
    </section>


    <section class="categorias"> <!--No se debe quitar-->
    </section>


    <dialog class="menuIngreso">
        <div>
            <input class="nombre" type="text" placeholder="Nuevo Ingreso...">
            <input class="cantidad" type="text" placeholder="Cantidad...">
        </div>
        <select class="catCompras">
            <option value="ropa">Ropa</option>
            <option value="comida">Comida</option>
            <option value="entretenimiento">Entretenimiento</option>
            <option value="medicina">Medicina</option>
            <option value="varios">Varios</option>

        </select>        
        <div>
            <button class="cerrar">Cerrar</button>
            <button class="guardar">Guardar</button>
        </div>
        <p class="hide">Error. Vuelva a itentarlo</p>
    </dialog>
    <dialog class="menuGasto">
        <div>
            <input class="nombre" type="text" placeholder="Nuevo Gasto...">
            <input class="cantidad" type="text" placeholder="Cantidad...">
        </div>
        <select class="catCompras">
            <option value="ropa">Ropa</option>
            <option value="comida">Comida</option>
            <option value="entretenimiento">Entretenimiento</option>
            <option value="medicina">medicina</option>
            <option value="varios">Varios</option>

        </select>
        <div>
            <button class="cerrar">Cerrar</button>
            <button class="guardar">Guardar</button>
        </div>

        <p class="hide">Error. Vuelva a itentarlo</p>
    </dialog>

    <script type="module" src="function.js"></script>
    

</body>
</html>
